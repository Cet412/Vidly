name: Android Build & Test

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Test dulu. Kalau merah, langkah build & upload otomatis terlewat.
      - name: Run Unit Tests
        run: ./gradlew testStagingDebugUnitTest

      - name: Build Staging Debug APK
        run: ./gradlew assembleStagingDebug

      # if: success() eksplisit — APK hanya diunggah kalau test & build lolos.
      - name: Upload Staging Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vidly-staging-debug
          path: app/build/outputs/apk/staging/debug/*.apk
          if-no-files-found: error
          retention-days: 7
